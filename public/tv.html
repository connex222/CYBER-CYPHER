<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070D">
<title>Cyber Cypher</title>
<style>
/* =====================================================================
   CYBER CYPHER — TV. 1920×1080 stage, scaled to fit any 16:9 screen.
   ART HOOKS: every image is optional. If a file in /assets is missing the
   CSS/SVG placeholder underneath shows. See ASSET-MANIFEST.md.
   ===================================================================== */
:root{
  --bg:#05070D;--panel:rgba(12,18,32,.82);--panel-2:rgba(20,30,52,.9);--line:#22314F;--ink:#EAF2FF;--muted:#8FA0BF;
  --volt:#22E4FF;--flare:#FFB020;--noise:#8C93A8;--zero:#FF2E5B;--ice:#B48CFF;--ok:#3DFF9A;
  --glow-volt:0 0 18px rgba(34,228,255,.55);--glow-flare:0 0 18px rgba(255,176,32,.55);
  --k:1;--ts:1;color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:Atkinson,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--volt);outline-offset:4px}
.orb{font-family:Orbitron,Atkinson,sans-serif;letter-spacing:.06em}
.num{font-variant-numeric:tabular-nums;font-weight:700}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--k));overflow:hidden;font-size:calc(30px*var(--ts));
  background:
    url('/assets/bg/grid.webp') center/cover no-repeat,
    radial-gradient(1200px 600px at 50% -10%,rgba(34,228,255,.16),transparent 60%),
    radial-gradient(900px 700px at 100% 100%,rgba(255,176,32,.10),transparent 60%),
    linear-gradient(rgba(34,228,255,.06) 1px,transparent 1px) 0 0/64px 64px,
    linear-gradient(90deg,rgba(34,228,255,.06) 1px,transparent 1px) 0 0/64px 64px,
    linear-gradient(#060914,#04060C)}
#stage[data-screen="title"],#stage[data-screen="tutorial"]{background-image:url('/assets/bg/title.webp'),radial-gradient(1200px 700px at 50% 30%,rgba(34,228,255,.18),transparent 65%),linear-gradient(rgba(34,228,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(34,228,255,.07) 1px,transparent 1px),linear-gradient(#060914,#04060C);background-size:cover,auto,64px 64px,64px 64px,auto}
#stage[data-screen="lobby"]{background-image:url('/assets/bg/lobby.webp'),radial-gradient(900px 600px at 20% 30%,rgba(34,228,255,.14),transparent 65%),radial-gradient(900px 600px at 80% 70%,rgba(255,176,32,.12),transparent 65%),linear-gradient(#060914,#04060C);background-size:cover,auto,auto,auto}
#stage[data-screen="result"]{background-image:url('/assets/bg/result.webp'),radial-gradient(1200px 700px at 50% 40%,rgba(255,255,255,.08),transparent 65%),linear-gradient(#060914,#04060C);background-size:cover,auto,auto}
#scan{position:absolute;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);mix-blend-mode:overlay}
#scene{position:absolute;inset:0;z-index:2}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(6px)}
.btn{min-height:84px;padding:12px 36px;border-radius:14px;border:2px solid var(--volt);background:rgba(10,30,44,.9);font-size:30px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:14px;letter-spacing:.04em;transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .15s;white-space:nowrap}
.btn:hover{box-shadow:var(--glow-volt)}.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#5CF0FF,#12B8D6);color:#021018;border-color:#9AF6FF}
.btn.amber{border-color:var(--flare)}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:rgba(34,228,255,.12);border:1px solid rgba(34,228,255,.35);font-size:22px}
.muted{color:var(--muted)}
.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}.enter2{animation:enter .45s .08s cubic-bezier(.2,.8,.2,1) both}.enter3{animation:enter .45s .16s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(24px)}}
.settled .enter,.settled .enter2,.settled .enter3{animation:none}
.glitch{animation:glitch .5s steps(2) both}
@keyframes glitch{0%{clip-path:inset(0 0 60% 0);transform:translateX(-8px)}25%{clip-path:inset(40% 0 20% 0);transform:translateX(8px)}50%{clip-path:inset(10% 0 70% 0)}100%{clip-path:inset(0);transform:none}}
.ico{width:44px;height:44px;flex:none}
.av{width:64px;height:64px;border-radius:12px;flex:none}

/* ---------- title ---------- */
.logo{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:1300px;height:420px;background:url('/assets/ui/logo.webp') center/contain no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:titleLogoAssemble 2.15s cubic-bezier(.22,.68,.17,1) both}
.logo-fallback{font-family:Orbitron,sans-serif;font-weight:900;font-size:170px;line-height:.9;letter-spacing:.06em;color:#E9FDFF;text-shadow:0 0 20px rgba(34,228,255,.9),0 0 60px rgba(34,228,255,.5),6px 0 0 rgba(255,46,91,.6),-6px 0 0 rgba(34,228,255,.6)}
.logo-fallback small{display:block;font-size:40px;letter-spacing:.5em;color:var(--flare);text-shadow:0 0 18px rgba(255,176,32,.7);margin-top:18px}
.has-logo .logo-fallback{visibility:hidden}
.tagline{position:absolute;left:0;right:0;top:600px;text-align:center;font-size:34px;color:var(--muted);letter-spacing:.2em;animation:titleDetailIn .6s 1.45s ease-out both}
.menu{position:absolute;left:50%;top:690px;transform:translateX(-50%);display:flex;gap:24px;animation:titleMenuIn .65s 1.7s cubic-bezier(.2,.8,.2,1) both}
@keyframes titleLogoAssemble{
  0%{opacity:0;transform:translate(-50%,20px) scale(1.07)}
  13%{opacity:.55;transform:translate(-49.6%,10px) scale(1.04)}
  17%{opacity:.22;transform:translate(-50.4%,10px) scale(1.04)}
  21%{opacity:.75;transform:translate(-50%,8px) scale(1.03)}
  35%{opacity:.78;transform:translate(-50.25%,4px) scale(1.015)}
  39%{opacity:.56;transform:translate(-49.8%,4px) scale(1.015)}
  53%,100%{opacity:1;transform:translateX(-50%) scale(1)}
}
@keyframes titleDetailIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes titleMenuIn{from{opacity:0;transform:translate(-50%,40px)}to{opacity:1;transform:translateX(-50%)}}
#stage.intro-done .logo,#stage.intro-done .tagline,#stage.intro-done .menu{animation:none}


/* ---------- lobby ---------- */
.joinp{position:absolute;left:80px;top:80px;width:520px;bottom:80px;display:flex;flex-direction:column;align-items:center;gap:18px;padding:34px;text-align:center}
.code{font-family:Orbitron,sans-serif;font-weight:900;font-size:120px;letter-spacing:.12em;color:#E9FDFF;text-shadow:0 0 24px rgba(34,228,255,.8)}
.qr{background:#fff;border-radius:16px;padding:14px;width:300px;height:300px}.qr svg{width:100%;height:100%;display:block}
.crews{position:absolute;left:640px;right:80px;top:80px;bottom:240px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.crews.coop{grid-template-columns:1fr}
.crew{padding:26px;display:flex;flex-direction:column;gap:14px;border-color:var(--tc)}
.crew h2{margin:0;font-family:Orbitron,sans-serif;font-size:52px;color:var(--tc);text-shadow:0 0 18px var(--tc);display:flex;align-items:center;gap:14px}
.crew h2 .ico{width:56px;height:56px}
.member{display:flex;align-items:center;gap:16px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.04);font-size:30px;animation:enter .5s cubic-bezier(.2,.8,.2,1) both}
.member .badge{margin-left:auto;font-size:18px;padding:4px 12px;border-radius:999px;border:1px solid var(--tc);color:var(--tc);font-family:Orbitron,sans-serif}
.member.off{opacity:.4}
.lobbybar{position:absolute;left:640px;right:80px;bottom:80px;height:130px;display:flex;align-items:center;gap:20px;padding:0 28px}
.lobbybar .set{display:flex;flex-wrap:wrap;gap:10px;flex:1}

/* ---------- game ---------- */
.side{position:absolute;top:40px;bottom:40px;width:300px;padding:22px;display:flex;flex-direction:column;gap:14px;border-color:var(--tc)}
.side.left{left:40px}.side.right{right:40px}
.side .emblem{width:120px;height:120px;margin:0 auto;display:grid;place-items:center;color:var(--tc);background-position:center;background-size:contain;background-repeat:no-repeat}
.side .emblem .ico{width:110px;height:110px;filter:drop-shadow(0 0 12px var(--tc))}
.has-emblem-volt .emb-volt .ico,.has-emblem-flare .emb-flare .ico,.has-emblem-ice .emb-ice .ico{visibility:hidden}
.emb-volt{background-image:url('/assets/ui/emblem-volt.webp')}.emb-flare{background-image:url('/assets/ui/emblem-flare.webp')}.emb-ice{background-image:url('/assets/ui/emblem-ice.webp')}
.side h3{margin:0;text-align:center;font-family:Orbitron,sans-serif;font-size:40px;color:var(--tc);text-shadow:0 0 14px var(--tc)}
.side .left-count{text-align:center;font-family:Orbitron,sans-serif;font-size:96px;line-height:1;color:var(--tc)}
.side .lbl{text-align:center;font-size:20px;color:var(--muted);letter-spacing:.2em}
.side .op{display:flex;align-items:center;gap:10px;font-size:22px}
.side .op .av{width:44px;height:44px}
.side .log{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:6px;font-size:22px}
.side .log div{display:flex;justify-content:space-between;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.04)}
.side.turn{box-shadow:0 0 0 3px var(--tc),0 0 40px var(--tc)}
.cluebar{position:absolute;left:360px;right:360px;top:40px;height:150px;display:flex;align-items:center;justify-content:center;gap:28px;padding:0 30px;border-color:var(--tc)}
.cluebar .word{font-family:Orbitron,sans-serif;font-weight:800;font-size:72px;letter-spacing:.08em;color:#fff;text-shadow:0 0 18px var(--tc)}
.cluebar .n{font-family:Orbitron,sans-serif;font-weight:900;font-size:72px;color:var(--tc);min-width:80px;text-align:center}
.cluebar .state{font-size:30px;color:var(--muted);letter-spacing:.12em}
.cluebar .scan-state{position:absolute;right:20px;bottom:5px;font-size:19px;font-weight:700;letter-spacing:.09em;color:var(--volt);pointer-events:none}
.ring{position:relative;width:110px;height:110px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Orbitron,sans-serif;font-size:34px}
.grid{position:absolute;left:366px;top:216px;width:1188px;height:768px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:12px;perspective:1400px}
.card{position:relative;border-radius:14px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.card .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;overflow:hidden}
.card .front{background:url('/assets/cards/node.webp') center/cover,linear-gradient(160deg,rgba(28,40,66,.96),rgba(10,16,30,.98));border:2px solid #2A3B60;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.45)}
.card .front .w{font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#F2F7FF;line-height:1.05;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.card .front .corner{position:absolute;top:8px;left:10px;width:14px;height:14px;border-left:2px solid #3E5C8F;border-top:2px solid #3E5C8F}
.card .front .corner.b{top:auto;left:auto;bottom:8px;right:10px;border:0;border-right:2px solid #3E5C8F;border-bottom:2px solid #3E5C8F}
.card .def{position:absolute;top:6px;right:8px;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);color:var(--muted);font-size:18px;display:grid;place-items:center;font-weight:700}
.card .back{transform:rotateY(180deg);flex-direction:column;gap:6px;border:2px solid var(--oc)}
.card .back .w{font-weight:700;text-transform:uppercase;font-size:22px;letter-spacing:.08em;color:rgba(255,255,255,.85)}
.card .back .ico{width:54px;height:54px;color:#fff}
.card.rv{transform:rotateY(180deg)}
.card.o-volt .back{--oc:var(--volt);background:url('/assets/cards/volt.webp') center/cover,linear-gradient(160deg,#0B6E86,#04313E);box-shadow:var(--glow-volt)}
.card.o-flare .back{--oc:var(--flare);background:url('/assets/cards/flare.webp') center/cover,linear-gradient(160deg,#9A5E00,#3E2500);box-shadow:var(--glow-flare)}
.card.o-noise .back{--oc:var(--noise);background:url('/assets/cards/noise.webp') center/cover,repeating-linear-gradient(45deg,#2B3040 0 10px,#232838 10px 20px)}
.card.o-zero .back{--oc:var(--zero);background:url('/assets/cards/zero.webp') center/cover,radial-gradient(circle,#7A0020,#20000A);box-shadow:0 0 30px rgba(255,46,91,.8)}
.card.o-ice .back{--oc:var(--ice);background:url('/assets/cards/ice.webp') center/cover,linear-gradient(160deg,#4A2C8A,#1B0F38)}
.card.ghost .back{opacity:.55}
.card.ghost{transform:rotateY(180deg)}
.card .pings{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:4px;justify-content:center;z-index:2;transform:translateZ(1px)}
.card .pings .av{width:30px;height:30px;border-radius:8px;box-shadow:0 0 0 2px var(--tc)}
.card.heat .front{border-color:var(--tc);box-shadow:0 0 0 2px var(--tc),0 0 26px var(--tc)}
.card .bar{position:absolute;left:0;bottom:0;height:6px;background:var(--tc);border-radius:0 0 0 14px;width:0;z-index:3}
.card.breach .front{animation:pulse .4s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.35)}}
.passbox{position:absolute;left:366px;right:366px;bottom:12px;height:0}
.defbar{position:absolute;left:366px;right:366px;bottom:14px;padding:10px 20px;font-size:24px;border-radius:12px;opacity:0;transition:opacity .3s}
.defbar.on{opacity:1}
.banner{position:absolute;left:0;right:0;top:400px;text-align:center;font-family:Orbitron,sans-serif;font-weight:900;font-size:140px;letter-spacing:.08em;color:var(--tc);text-shadow:0 0 30px var(--tc),0 0 80px var(--tc);pointer-events:none;z-index:6}
.endbar{position:absolute;left:360px;right:360px;top:40px;height:150px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-color:var(--tc);z-index:7}
.endbar .t{font-family:Orbitron,sans-serif;font-size:52px;color:var(--tc);text-shadow:0 0 16px var(--tc)}
.molepanel{position:absolute;left:360px;right:360px;bottom:40px;padding:20px 30px;display:flex;gap:30px;justify-content:center;z-index:7;font-size:28px}

/* ---------- tutorial ---------- */
.tut{position:absolute;inset:0}
.tut .caption{position:absolute;left:160px;right:160px;bottom:90px;padding:28px 40px;font-size:40px;line-height:1.3;text-align:center}
.tut .steps{position:absolute;left:0;right:0;top:40px;display:flex;justify-content:center;gap:10px}
.tut .steps i{width:40px;height:6px;border-radius:3px;background:#22314F}.tut .steps i.on{background:var(--volt);box-shadow:var(--glow-volt)}
.tut .demo{position:absolute;left:50%;top:150px;transform:translateX(-50%)}
.mini{display:grid;grid-template-columns:repeat(3,260px);gap:14px}
.mini .card{height:150px}
.tut .nav{position:absolute;right:100px;top:40px;display:flex;gap:14px}
.tut .controls{position:absolute;left:90px;top:38px;display:flex;gap:12px;align-items:center;z-index:8}
.tut .controls .btn,.tut .nav .btn{min-height:68px;font-size:25px;padding:10px 22px}
.tut .exit{position:absolute;left:90px;bottom:32px;z-index:8;min-height:52px;font-size:22px}
.tut .caption{bottom:105px}
.tut .steps{top:123px}
.tut .demo{top:185px}

/* ---------- overlays ---------- */
#subs{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:1400px;padding:12px 26px;border-radius:12px;background:rgba(3,6,12,.88);border:1px solid rgba(34,228,255,.4);font-size:calc(30px*var(--ts));text-align:center;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}
#subs.on{opacity:1}
#subs .halo{display:none;width:48px;height:48px;border-radius:50%;vertical-align:middle;margin-right:10px;background:url('/assets/ui/halo.webp') center/cover}
.has-halo #subs .halo{display:inline-block}#subs b{color:var(--volt);font-family:Orbitron,sans-serif;font-weight:700;font-size:.8em;letter-spacing:.15em}
#reacts{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:21}
.react{position:absolute;bottom:-90px;font-size:72px;animation:rise 3s ease-out forwards}
@keyframes rise{to{transform:translateY(-760px);opacity:0}}
#overlay{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:rgba(3,6,12,.86);text-align:center}
#overlay.on{display:flex}
#toast{position:absolute;left:50%;top:220px;transform:translateX(-50%);padding:14px 28px;border-radius:14px;background:#EAF2FF;color:#05070D;font-weight:700;opacity:0;transition:opacity .3s;z-index:35;pointer-events:none}
#toast.on{opacity:1}
#status{position:absolute;right:20px;bottom:10px;font-size:18px;color:var(--muted);z-index:36}
.setrow{display:flex;align-items:center;gap:24px;font-size:30px}.setrow label{width:420px}
.setrow input[type=range]{width:520px;accent-color:var(--volt)}
.seg{display:flex;gap:10px}.seg button{min-height:60px;padding:0 24px;border-radius:12px;border:2px solid var(--line);background:var(--panel-2);font-size:26px;font-weight:700}.seg button.on{border-color:var(--volt);background:var(--volt);color:#021018}
.hc #stage{background:#000}.hc #scan{display:none}.hc .panel{background:#000;border-color:#fff}.hc .muted{color:#fff}
.rm *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<div id="stage" data-screen="title">
  <div id="scene"></div>
  <div id="subs" aria-live="polite"></div>
  <div id="reacts"></div>
  <div id="overlay" role="dialog"></div>
  <div id="toast" role="status"></div>
  <div id="status"></div>
  <div id="scan"></div>
</div>
<script>
/*@@SHARED_START@@*/
/* ===== CYBER CYPHER — shared client code (injected into tv.html and play.html by tools/build.js) ===== */
var CC = (function () {
  'use strict';
  var TEAM = {
    volt:  { name: 'VOLT',  colour: '#22E4FF', day: '#00728A', shape: 'hex' },
    flare: { name: 'FLARE', colour: '#FFB020', day: '#9A5A00', shape: 'tri' },
    noise: { name: 'NOISE', colour: '#8C93A8', day: '#4E5466', shape: 'bar' },
    zero:  { name: 'ZERO DAY', colour: '#FF2E5B', day: '#B0002A', shape: 'x' },
    ice:   { name: 'ICE',   colour: '#B48CFF', day: '#5B33B0', shape: 'diamond' }
  };
  var AVATAR_NAMES = ['Static', 'Cipher', 'Neon', 'Glitch', 'Vector', 'Pixel', 'Nova', 'Rook', 'Echo', 'Flux', 'Kestrel', 'Onyx',
    'Juno', 'Halcyon', 'Quark', 'Raven', 'Siren', 'Tango', 'Umbra', 'Volta', 'Wraith', 'Xeno', 'Yara', 'Zephyr'];
  var REACTS = { wow: '\uD83D\uDE2E', laugh: '\uD83D\uDE02', fire: '\uD83D\uDD25', facepalm: '\uD83E\uDD26', clap: '\uD83D\uDC4F', shock: '\u26A1' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function secs(ms) { return Math.max(0, Math.ceil(ms / 1000)); }
  function clock(ms) { var s = secs(ms); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function num(n) { return n === -1 ? '\u221E' : String(n); }

  // ---------- network with clock sync and auto-reconnect ----------
  function Net(onMessage, onStatus) {
    this.onMessage = onMessage; this.onStatus = onStatus || function () {};
    this.ws = null; this.queue = []; this.offsets = []; this.offset = 0; this.retry = 0;
    this.connect();
    var self = this;
    setInterval(function () { self.sync(); }, 10000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && (!self.ws || self.ws.readyState > 1)) self.connect(); });
  }
  Net.prototype.connect = function () {
    var self = this;
    if (this.ws && this.ws.readyState <= 1) return;
    var ws; try { ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host); } catch (e) { return this.later(); }
    this.ws = ws; this.onStatus('connecting');
    ws.onopen = function () { self.retry = 0; self.onStatus('open'); self.sync(); self.sync(); var q = self.queue; self.queue = []; q.forEach(function (m) { ws.send(m); }); };
    ws.onmessage = function (ev) {

  function bind() {

    scene.querySelectorAll('[data-host]').forEach(function (b) { b.onclick = function () { host(b.dataset.host); }; });
    scene.querySelectorAll('[data-tut]').forEach(function (b) {
      b.onclick = function () {
        AUDIO.unlock(); var n = S.tut + Number(b.dataset.tut);
        if (n >= TUT.length) { TUTORIAL_AUDIO.stop(); S.screen = S.session ? 'room' : 'title'; S.tut = 0; S.lastKey = ''; render(); }
        else { S.tut = Math.max(0, n); AUDIO.sfx(Number(b.dataset.tut) < 0 ? 'ui_back' : 'ui_tap'); S.lastKey = ''; render(); TUTORIAL_AUDIO.play(S.tut, false); }
      };
    });
    var playBtn = scene.querySelector('[data-tut-play]'), pauseBtn = scene.querySelector('[data-tut-pause]'), replayBtn = scene.querySelector('[data-tut-replay]'), exitBtn = scene.querySelector('[data-tut-exit]');
    if (playBtn) playBtn.onclick = function () { AUDIO.unlock(); TUTORIAL_AUDIO.play(S.tut, true); };
    if (pauseBtn) pauseBtn.onclick = function () { TUTORIAL_AUDIO.pause(); };
    var stopBtn = scene.querySelector('[data-tut-stop]'); if (stopBtn) stopBtn.onclick = function () { TUTORIAL_AUDIO.stop(); };
    var muteBtn = scene.querySelector('[data-tut-mute]'); if (muteBtn) muteBtn.onclick = function () { TUTORIAL_AUDIO.toggleMute(); };
    if (replayBtn) replayBtn.onclick = function () { AUDIO.unlock(); TUTORIAL_AUDIO.play(S.tut, false); };
    if (exitBtn) exitBtn.onclick = function () {
      TUTORIAL_AUDIO.stop(); S.screen = S.session ? 'room' : 'title'; S.tut = 0; S.lastKey = ''; render();
    };
    TUTORIAL_AUDIO.update();
    scene.querySelectorAll('[data-range]').forEach(function (i) { i.oninput = function () { settings[i.dataset.range] = +i.value; saveSettings(); }; });
    scene.querySelectorAll('[data-seg]').forEach(function (b) { b.onclick = function () { var v = b.dataset.val; settings[b.dataset.seg] = v === 'true' ? true : v === 'false' ? false : +v; saveSettings(); S.lastKey = ''; render(); }; });
  }
  // One-off skippable title treatment. No route, role or gameplay state changes.
  var titleVoiceTimer = null;
  var titleIntroDone=false;
  function finishTitleIntro(){if(titleIntroDone)return;titleIntroDone=true;stage.classList.add('intro-done');}
  setTimeout(finishTitleIntro,2500);
  function skipTitleIntro(e){
    if(titleIntroDone||S.screen!=='title')return;
    AUDIO.unlock();finishTitleIntro();e.preventDefault();e.stopImmediatePropagation();
  }
  addEventListener('click',skipTitleIntro,true);
  addEventListener('keydown',skipTitleIntro,true);
  addEventListener('pointerdown', function first() {
    removeEventListener('pointerdown', first, true); AUDIO.unlock();
    if (S.screen === 'title') {
      AUDIO.playMusic('title');
      titleVoiceTimer = setTimeout(function () {
        titleVoiceTimer = null;
        // Never start a second voice after the player has opened Training.
        if (S.screen === 'title') AUDIO.say('vo_title');
      }, 500);
    }
  }, true);
  addEventListener('keydown', function (e) {
    AUDIO.unlock();
    if (S.screen === 'tutorial' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { var b = scene.querySelector('[data-tut="' + (e.key === 'ArrowRight' ? 1 : -1) + '"]'); if (b) b.click(); }
    if (e.code === 'Space' && S.game && S.room && !['OVER', 'MOLEVOTE'].includes(S.game.phase)) { e.preventDefault(); host(S.room.paused ? 'resume' : 'pause'); }
    if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function () {}); else document.exitFullscreen(); }
  });

  // ================= live updates =================
  function playerById(id) { return S.room && S.room.players.find(function (p) { return p.id === id; }); }
  var lastWarnS = null;
  function update() {
    var g = S.game; if (!g || !S.meters || screenName() !== 'game') return;
    var gt = CC.gtNow(net, S.meters);
    // timer ring
    var arc = $('#ringArc'), rn = $('#ringNum');
    if (arc) {
      var total = g.phase === 'CLUE' ? (S.room.timers[S.room.settings.timer] || {}).clue : (S.room.timers[S.room.settings.timer] || {}).guess;
      if (g.deadlineGt && total) {
        var left = g.deadlineGt - gt; rn.textContent = CC.secs(left); arc.style.strokeDashoffset = 276.5 * (1 - Math.max(0, left) / (total * 1000));
        var s = CC.secs(left); if (s <= 10 && s !== lastWarnS && s > 0) { lastWarnS = s; AUDIO.sfx('timer_warn'); }
        arc.style.stroke = left < 10000 ? 'var(--zero)' : TEAM[g.turnTeam].colour;
      } else { rn.textContent = '\u221E'; arc.style.strokeDashoffset = 0; }
    }
    var gi = $('#guessInfo'); if (gi) gi.textContent = g.guessesLeft === null ? 'UNLIMITED' : g.guessesLeft + ' GUESS' + (g.guessesLeft === 1 ? '' : 'ES') + ' LEFT';
    var scan = $('#scanInfo');
    if (scan) {
      var maxVotes = 0;
      Object.keys(g.pings || {}).forEach(function (target) { if (target !== 'pass') maxVotes = Math.max(maxVotes, g.pings[target].length); });
      var msg = g.breach ? (g.breach.target === 'pass' ? 'ENDING TURN' : 'LOCKING NODE · HOLD THE VOTE') :
        (maxVotes ? 'CREW SCAN · ' + maxVotes + '/' + g.needed + ' PINGS' : 'CREW SCAN · ' + g.needed + ' PINGS TO LOCK');
      if (scan.textContent !== msg) scan.textContent = msg;
    }
    // pings, heat, breach bars
    var defs = [];
    g.cards.forEach(function (c, i) {
      var el = $('#card' + i); if (!el || c.revealed) return;
      var who = g.pings[i] || [], pe = $('#pings' + i), bar = $('#bar' + i);
      var h = who.map(function (id) { var p = playerById(id); return p ? CC.avatar(p.avatar) : ''; }).join('');
      if (pe && pe.getAttribute('data-k') !== who.join()) { pe.innerHTML = h; pe.setAttribute('data-k', who.join()); }
      el.classList.toggle('heat', who.length > 0);
      var br = g.breach && g.breach.target === i;
      el.classList.toggle('breach', !!br);
      if (bar) bar.style.width = br ? Math.min(100, 100 - (g.breach.endsGt - gt) / 16) + '%' : (who.length ? (who.length / Math.max(1, g.needed) * 100 * .5) + '%' : '0');
      if (who.length && c.def) defs.push(c.word + ' \u2014 ' + c.def);
    });
    var db = $('#defbar'); if (db) { var t = defs[0] || ''; if (db.textContent !== t) db.textContent = t; db.classList.toggle('on', !!t); }
    var rn2 = $('#resumeNum'); if (rn2 && S.room.resumeAt) rn2.textContent = Math.max(0, Math.ceil((S.room.resumeAt - net.serverNow()) / 1000));
  }
  (function loop() { try { update(); } catch (e) { /* keep going */ } requestAnimationFrame(loop); })();

  CC.detectArt(function () { S.lastKey = ''; render(); });
  if (S.session) S.screen = 'room';
  render();
})();
</script>
