name: CYBER CYPHER live avatar visual acceptance

on:
  push:
    branches: [qa/live-avatar-browser-layout]
    paths:
      - "tools/live-avatar-visual.js"
      - ".github/workflows/live-avatar-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked game dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Install Chromium testing tooling without changing the package lock
        shell: bash
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate browser test source
        run: node --check tools/live-avatar-visual.js
      - name: Test deployed Render TV/phone UI and all 24 avatars
        env:
          CC_VISUAL_URL: https://cyber-cypher-j2ry.onrender.com
          CC_SCREENSHOTS: qa/screenshots
        run: node tools/live-avatar-visual.js
      - name: Save actual live TV and phone screenshots for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyber-cypher-live-visual-evidence
          path: qa/screenshots/
          if-no-files-found: warn
          retention-days: 14
