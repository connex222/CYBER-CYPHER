name: Native 24-avatar production acceptance

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/avatars/**'
      - 'tools/shared.js'
      - 'tools/live-acceptance.js'
      - 'tools/stage25-multiplayer.js'
      - 'tools/browser-acceptance.js'
      - 'public/tv.html'
      - 'public/play.html'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - 'src/config.js'
      - 'production/verify_native_avatars.py'
      - 'production/verify_halo_audio.py'
      - 'public/audio/vo_tut_*.mp3'
      - '.github/workflows/native-avatar-qa.yml'
  pull_request:
    paths:
      - 'public/assets/avatars/**'
      - 'tools/shared.js'
      - 'tools/live-acceptance.js'
      - 'tools/stage25-multiplayer.js'
      - 'tools/browser-acceptance.js'
      - 'public/tv.html'
      - 'public/play.html'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - 'src/config.js'
      - 'production/verify_native_avatars.py'
      - 'production/verify_halo_audio.py'
      - '.github/workflows/native-avatar-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-complete-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@v4
      - name: Set up Python and WebP decoder
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow mutagen
      - name: Verify image count, mapping, dimensions and uniqueness
        run: python production/verify_native_avatars.py --report /tmp/cyber-avatar-qa.json
      - name: Check all 11 HALO tutorial recordings
        run: python production/verify_halo_audio.py
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run original unit tests and build
        run: |
          npm test
          npm run build
      - name: Serve all 24 WebPs and test independent real WebSockets
        shell: bash
        run: |
          set -euo pipefail
          export PORT=3123 BOTS=1 CC_SPEED=10
          node server.js >/tmp/cc-avatar-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/cc-avatar-server.log' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3123/healthz >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:3123/healthz
          for i in $(seq -w 0 23); do
            file="agent-$i.webp"
            status=$(curl -sS --max-time 12 -o "/tmp/$file" -w '%{http_code}' "http://127.0.0.1:3123/assets/avatars/$file")
            test "$status" = "200" || { echo "Failed $file: $status"; exit 1; }
            cmp "/tmp/$file" "public/assets/avatars/$file" || { echo "Mismatch HTTP file: $file"; exit 1; }
          done
          echo 'PASS: All 24 WebP routes serve the exact committed image bytes.'
          CC_ACCEPTANCE_HTTP=http://127.0.0.1:3123 node tools/live-acceptance.js
      - name: Stage 25 independent multiplayer WebSocket matrix
        shell: bash
        run: |
          set -euo pipefail
          export PORT=3123 BOTS=0 CC_SPEED=1
          node server.js >/tmp/cc-stage25-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/cc-stage25-server.log' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3123/healthz >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          CC_ACCEPTANCE_HTTP=http://127.0.0.1:3123 node tools/stage25-multiplayer.js
      - name: Install Chromium browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Run local Chromium tutorial and responsive acceptance
        shell: bash
        run: |
          set -euo pipefail
          PORT=3123 node server.js >/tmp/cc-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/cc-browser-server.log' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3123/healthz >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          CC_ACCEPTANCE_HTTP=http://127.0.0.1:3123 node tools/browser-acceptance.js
      - name: Declare human QA requirement
        run: echo "Automated acceptance does not prove portrait identity, cropping, browser visuals, audio playback, or real-device multiplayer."
