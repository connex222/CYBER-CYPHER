name: Package approved CYBER CYPHER artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "production/art-sources.json"
      - "production/build_art.py"
      - ".github/workflows/approved-art-assets.yml"

permissions:
  contents: write

concurrency:
  group: cyber-cypher-approved-art
  cancel-in-progress: false

jobs:
  build-and-commit-art:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free image tooling
        run: python -m pip install --disable-pip-version-check Pillow numpy fonttools brotli
      - name: Download, optimise and validate approved source art
        run: python production/build_art.py
      - name: Verify all 16 image assets offline
        run: python production/build_art.py --verify-only
      - name: Check game rules still pass
        run: |
          node --version
          npm test
          npm run build
      - name: Commit verified local WebP files to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/ART-QA.json public/assets/ui public/assets/bg public/assets/cards
          if git diff --cached --quiet; then
            echo "Art files unchanged; no commit needed."
          else
            git commit -m "art: integrate 16 validated offline-ready WebP assets (no avatars)"
            git push origin HEAD:main
          fi
