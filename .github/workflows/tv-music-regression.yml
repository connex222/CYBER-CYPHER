name: CYBER CYPHER second-screen music regression

on:
  push:
    branches: [feature/lobby-music-and-avatar-art-direction, main]
    paths:
      - "public/tv.html"
      - "test/tv-music.test.js"
      - ".github/workflows/tv-music-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-music:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify TV script parses
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('public/tv.html','utf8');
          for(const [i,x] of [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].entries()) if(x[1].trim()) new vm.Script(x[1],{filename:'tv-'+i+'.js'});
          console.log('PASS: TV inline scripts parse');
          NODE
      - name: Verify title, second-screen, lobby and gameplay music routing
        run: |
          npm test
          npm run build
